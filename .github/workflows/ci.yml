name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck library
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run tests
        if: matrix.node-version == '24'
        run: npm test

      - name: Run tests with coverage thresholds
        if: matrix.node-version == '22'
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ESM, CJS and type declarations
        run: npm run build

      - name: Smoke-test the published entry points
        run: |
          node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.Bridge !== 'function') throw new Error('ESM build does not export Bridge')"
          node -e "const m = require('./dist/index.cjs'); if (typeof m.Bridge !== 'function') throw new Error('CJS build does not export Bridge')"
